[project]
name = "outlet-detect"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "minio>=7.2.20",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "openai>=3.41.0",
    "opencv-python>=5.0.0.93",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
