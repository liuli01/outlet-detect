# 推送 v* 标签时：测试 → 构建镜像 → 容器冒烟（接口故障容错）→ 发布 ghcr.io
# 用法：git tag v0.2.0 && git push origin v0.2.0
name: docker-publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 1) 本地构建（load）供冒烟
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: outlet-detect:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2) 冒烟：接口全部不可达时程序应降级运行而非崩溃
      - name: 容器冒烟测试
        run: sh deploy/smoke_test.sh outlet-detect:smoke

      # 3) 冒烟通过才发布（命中缓存，秒级）
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
