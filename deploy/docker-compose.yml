# 河道排污/漂浮物检测 —— 生产部署（定时任务 + 测试页面，纯镜像，不构建）
# 用法：在 deploy/ 目录下 `docker compose up -d`（首次先 docker compose pull）
# 配置：环境变量来自 ../.env（参考仓库根 .env.example），摄像头标定挂载 ../config/cameras
#
# 推理服务 xclabel-deploy-cpu 为独立部署（本仓库 compose 不包含）：
# 同机部署时经 host.docker.internal 访问其宿主端口映射（如 8000），
# .env 里填 INFER_ENDPOINT=http://host.docker.internal:8000/infer
services:
  # 定时任务主程序：每天 10:00~15:00（容器时区 Asia/Shanghai）每 5 分钟一轮检测上报
  outlet-detect:
    image: ghcr.io/liuli01/outlet-detect:latest
    container_name: outlet-detect
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux 下解析宿主机（推理服务在同机时用）
    volumes:
      - ../config/cameras:/app/config/cameras:ro
      - ../data:/app/data
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 系统无外露端口；依赖外部服务（地址见 ../.env）：
    #   - 推理服务 INFER_ENDPOINT（水面分割 + 漂浮物引擎）
    #   - 海康 Artemis 平台、minio、业务上报平台、VLM（可选）

  # 测试页面：上传照片/点选样本在线测漂浮物与排污检测
  # 浏览器打开 http://<服务器IP>:8090（无鉴权，请用防火墙限制内网访问）
  test-page:
    image: ghcr.io/liuli01/outlet-detect:latest
    container_name: outlet-detect-testpage
    restart: unless-stopped
    command: ["uv", "run", "--no-sync", "python", "-m", "outlet_detect.webapp"]
    env_file:
      - ../.env            # 只需要其中的 INFER_ENDPOINT
    environment:
      - TZ=Asia/Shanghai
      - WEBAPP_HOST=0.0.0.0   # 容器内必须绑 0.0.0.0，否则宿主机访问不到
      - WEBAPP_PORT=8090
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8090:8090"
    volumes:
      # 样本库（可选）：挂载后页面可点选 images/ 下的测试照片；不需要可删除该行
      - ../images:/app/images:ro
    logging: *logging

