# 河道排污/漂浮物检测 —— Docker Compose 部署
# 用法：在 deploy/ 目录下 `docker compose up -d`
# 配置：环境变量来自 ../.env（参考仓库根 .env.example），摄像头标定挂载 ../config/cameras
services:
  outlet-detect:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ghcr.io/${GITHUB_USER:-your-name}/outlet-detect:latest
    container_name: outlet-detect
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ../config/cameras:/app/config/cameras:ro
      - ../data:/app/data
    # 系统无外露端口；依赖外部服务：
    #   - 推理服务 http://<推理机>:8005（水面分割 + 漂浮物引擎）
    #   - 海康 Artemis 平台、minio、业务上报平台（见 ../.env）

  # 测试台（可选）：docker compose --profile tools up -d test-page
  # 浏览器打开 http://127.0.0.1:8090 上传照片测漂浮物/排污检测
  test-page:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ghcr.io/${GITHUB_USER:-your-name}/outlet-detect:latest
    container_name: outlet-detect-testpage
    profiles: ["tools"]
    command: ["uv", "run", "--no-sync", "python", "-m", "outlet_detect.webapp"]
    ports:
      - "8090:8090"
    # 需要能访问 8005 推理服务；容器内 127.0.0.1 指向容器自身，
    # 若推理服务在宿主机，启动前设置 extra_hosts 或用宿主机内网 IP
